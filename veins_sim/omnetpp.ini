[General]
network = veins_sim.LBDTScenario
sim-time-limit = 180s

# Cmdenv CLI logging
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s

# SUMO Integration Configuration
*.manager.updateInterval = 1s
*.manager.host = "127.0.0.1"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("veins_sim/launchd.xml")

# Playground size (10 km x 10 km grid with margin)
*.playgroundSizeX = 11000m
*.playgroundSizeY = 11000m
*.playgroundSizeZ = 50m

# Connection Manager / Radio Configuration
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 300m
*.connectionManager.drawMaxIntfDist = false

# Physical layer configurations for IEEE 802.11p V2X communication
*.**.nic.phy80211p.noiseFloor = -110dBm
*.**.nic.phy80211p.minPowerLevel = -89dBm
*.**.nic.phy80211p.maxTXPower = 20mW
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.decider = xmldoc("veins_sim/config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("veins_sim/config.xml")
*.**.nic.phy80211p.antenna = xmldoc("veins_sim/antenna.xml")

# MAC 1609.4 Parameters
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.useServiceChannel = false

# Application Layer Configuration (linking to our custom C++ LBDTApp module)
*.rsu[*].applType = "veins_sim.LBDTApp"
*.rsu[*].appl.isRSU = true

*.node[*].applType = "veins_sim.LBDTApp"
*.node[*].appl.isRSU = false

# Node mobility configuration (offset parameters required by TraCIMobility)
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 1.895

# Distribute 400 RSUs on a 20x20 grid across the 10km x 10km space
# X coordinate = (Index % 20) * 500m + 250m
# Y coordinate = (Index / 20) * 500m + 250m
*.rsu[0..399].mobility.x = (parentIndex() % 20) * 500 + 250
*.rsu[0..399].mobility.y = int(parentIndex() / 20) * 500 + 250
*.rsu[0..399].mobility.z = 3
